# Render Blueprint — deploy with: New + → Blueprint, point it at this repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: workshop-entry
    runtime: node
    plan: starter            # Starter ($7/mo) is required for the persistent disk
                             # below. See README for the free-tier alternative.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true

    # Persistent disk so the SQLite DB (and everyone's Entered/Not status)
    # survives restarts and redeploys. Without this, entry state is wiped on
    # any restart. Remove this whole block to run on the free plan.
    disk:
      name: entry-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_FILE
        value: /var/data/entry.db     # points at the persistent disk
      - key: TRUST_PROXY
        value: "1"                     # Render terminates TLS in front of us
      - key: SESSION_SECRET
        generateValue: true            # Render generates a strong value once
      - key: BASE_URL
        sync: false                    # set to your https://<name>.onrender.com URL
      - key: STAFF_PASSWORD
        sync: false                    # set in the Render dashboard
      - key: EVENT_NAME
        sync: false

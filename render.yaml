# Render Blueprint — FREE tier (no credit card), backed by Neon Postgres.
# Docs: https://render.com/docs/blueprint-spec
#
# Entry state (who has checked in) lives in your external Neon Postgres database,
# NOT on Render's disk. That means the free plan is fine: even though Render's
# filesystem is ephemeral and the service sleeps after ~15 min idle, restarts and
# redeploys no longer wipe entry status — it's durable in Neon. (First scan after
# an idle period still waits for a cold start of a few seconds.)
services:
  - type: web
    name: workshop-entry
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TRUST_PROXY
        value: "1"                     # Render terminates TLS in front of us
      - key: DATABASE_URL
        sync: false                    # paste your Neon pooled connection string (keep secret)
      - key: SESSION_SECRET
        generateValue: true            # Render generates a strong value once
      - key: BASE_URL
        sync: false                    # set to your https://<name>.onrender.com URL
      - key: STAFF_PASSWORD
        sync: false                    # set in the Render dashboard
      - key: EVENT_NAME
        sync: false
      # Email — QR passes are sent via Brevo's transactional HTTP API. Render's
      # free tier blocks outbound SMTP (ports 25/465/587), so Gmail/SMTP can't
      # send from here; Brevo's API is plain HTTPS on 443.
      - key: BREVO_API_KEY
        sync: false                    # Brevo dashboard → SMTP & API → API Keys (keep secret)
      - key: MAIL_FROM
        sync: false                    # a Brevo-verified sender, e.g. "Traces of Lenses × Fujifilm <you@gmail.com>"

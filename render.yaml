# Render Blueprint — FREE tier (no credit card), backed by Neon Postgres.
# Docs: https://render.com/docs/blueprint-spec
#
# Entry state (who has checked in) lives in your external Neon Postgres database,
# NOT on Render's disk. That means the free plan is fine: even though Render's
# filesystem is ephemeral and the service sleeps after ~15 min idle, restarts and
# redeploys no longer wipe entry status — it's durable in Neon. (First scan after
# an idle period still waits for a cold start of a few seconds.)
services:
  - type: web
    name: workshop-entry
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TRUST_PROXY
        value: "1"                     # Render terminates TLS in front of us
      - key: DATABASE_URL
        sync: false                    # paste your Neon pooled connection string (keep secret)
      - key: SESSION_SECRET
        generateValue: true            # Render generates a strong value once
      - key: BASE_URL
        sync: false                    # set to your https://<name>.onrender.com URL
      - key: STAFF_PASSWORD
        sync: false                    # set in the Render dashboard
      - key: EVENT_NAME
        sync: false
      # SMTP — required to send QR emails from the /admin page (server-side).
      - key: SMTP_HOST
        sync: false                    # e.g. smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"                 # true for port 465, false for 587 (STARTTLS)
      - key: SMTP_USER
        sync: false                    # your SMTP username / email
      - key: SMTP_PASS
        sync: false                    # Gmail: an App Password (keep secret)
      - key: MAIL_FROM
        sync: false                    # e.g. "Workshop Team <you@example.com>"
      # SEED_DATA is optional and usually NOT needed with Neon: import directly into
      # the shared Neon DB from your machine and the server reads the same rows.
      # Only set it if you want the server to seed an empty DB on first boot.
      # - key: SEED_DATA
      #   sync: false                  # paste contents of data/seed.b64.txt

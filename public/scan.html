<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entry scanner</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <div class="topbar">
    <strong>Entry scanner</strong>
    <span class="stats" id="stats">—</span>
    <span><a href="/admin">Dashboard</a> ·
      <form method="post" action="/logout" style="display:inline">
        <button class="ghost" style="padding:6px 10px;font-size:13px">Logout</button>
      </form>
    </span>
  </div>

  <div class="wrap">
    <div id="reader"></div>
    <div id="result" class="result" role="status" aria-live="assertive">
      <h2 id="result-title"></h2>
      <div class="name" id="result-name"></div>
      <div class="detail" id="result-detail"></div>
    </div>
    <p class="muted" id="hint" style="margin-top:14px">
      Point the camera at an attendee's QR code. Each code checks a person in once.
    </p>
  </div>

  <script src="/scan.js"></script>
</body>
</html>

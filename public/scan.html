<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ToLXFujiFilm - Entry Scanner</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand">Traces of Lenses <span class="x">×</span> Fujifilm <span class="kmit">KMIT</span></div>
    <span class="stats" id="stats">—</span>
    <span class="right"><a href="/admin">Dashboard</a>
      <form method="post" action="/logout" style="display:inline">
        <button class="ghost btn-sm">Logout</button>
      </form>
    </span>
  </div>

  <div class="wrap">
    <div style="margin:2px 0 18px">
      <span class="eyebrow">Entry Scanner</span>
      <hr class="accent-bar">
    </div>
    <div id="reader"></div>
    <div id="result" class="result" role="status" aria-live="assertive">
      <h2 id="result-title"></h2>
      <div class="name" id="result-name"></div>
      <div class="detail" id="result-detail"></div>
    </div>
    <p class="muted" id="hint" style="margin-top:16px;letter-spacing:.02em">
      Point the camera at an attendee's QR code. Each code checks a person in once.
    </p>
  </div>

  <script src="/scan.js"></script>
</body>
</html>
